<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>QUANTUM OVERLOAD // HARDCORE BULLET HELL</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #030712;
      color: #00f0ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .top-bar {
      position: absolute;
      top: calc(10px + env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 15;
      pointer-events: none;
    }
    .top-controls {
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }
    .btn-nav {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      font-size: 11px;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }
    .btn-nav:active {
      background: #00f0ff;
      color: #030712;
    }

    .xp-container {
      position: absolute;
      top: calc(46px + env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 10;
      pointer-events: none;
    }
    .xp-bar-bg {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }
    .xp-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f0ff, #00ff66);
      box-shadow: 0 0 8px #00ff66;
      transition: width 0.1s ease;
    }
    .xp-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
      font-family: monospace;
    }

    .stats-card {
      position: absolute;
      top: calc(68px + env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .stat-badge {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.25);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      backdrop-filter: blur(4px);
    }

    .mobile-controls {
      position: absolute;
      bottom: calc(18px + env(safe-area-inset-bottom));
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 15;
      pointer-events: none;
    }
    .action-circle-btn {
      pointer-events: auto;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #00f0ff;
      color: #00f0ff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      cursor: pointer;
      touch-action: manipulation;
    }
    .action-circle-btn:active {
      transform: scale(0.92);
      background: #00f0ff;
      color: #030712;
    }
    .action-circle-btn.emp-ready {
      border-color: #00ff66;
      color: #00ff66;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
      animation: pulse 0.8s infinite alternate;
    }

    .overlay {
      position: absolute;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(3, 7, 18, 0.96);
      border: 1px solid rgba(0, 240, 255, 0.4);
      padding: 24px 20px;
      border-radius: 16px;
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.25);
      max-width: 440px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(16px);
      max-height: 90vh;
      overflow-y: auto;
    }

    .upgrade-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin: 14px 0;
    }
    .upgrade-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 12px;
      border-radius: 10px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .upgrade-card:active, .upgrade-card:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: #00f0ff;
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }
    .upgrade-icon {
      font-size: 24px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 240, 255, 0.1);
      border-radius: 8px;
    }

    .btn-action {
      width: 100%;
      padding: 13px;
      background: #00f0ff;
      border: none;
      color: #030712;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
      margin-top: 10px;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-action:active {
      transform: scale(0.98);
      background: #ffffff;
    }
    .btn-secondary {
      background: rgba(121, 40, 202, 0.25);
      border: 1px solid #c084fc;
      color: #c084fc;
      box-shadow: 0 0 15px rgba(121, 40, 202, 0.3);
    }
    .btn-twitter {
      background: rgba(29, 155, 240, 0.2);
      border: 1px solid #1d9bf0;
      color: #1d9bf0;
      box-shadow: 0 0 15px rgba(29, 155, 240, 0.3);
    }

    /* 醒目警报横幅 */
    .danger-banner {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      font-weight: 900;
      color: #ff0055;
      text-shadow: 0 0 20px #ff0055;
      letter-spacing: 2px;
      z-index: 12;
      pointer-events: none;
      display: none;
      text-align: center;
      animation: alertPulse 0.4s infinite alternate;
      background: rgba(0,0,0,0.6);
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #ff0055;
    }
    @keyframes alertPulse {
      0% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.95); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    }

    /* 顶部 Toast 提示 */
    .toast-msg {
      position: absolute;
      top: calc(85px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: #00f0ff;
      color: #030712;
      font-weight: bold;
      font-size: 11px;
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
      z-index: 50;
      display: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div class="danger-banner" id="dangerBanner">⚠️ ANOMALY DETECTED ⚠️</div>
  <div class="toast-msg" id="toastMsg">TWEET COPIED TO CLIPBOARD!</div>

  <!-- 顶部状态栏 -->
  <div class="top-bar">
    <div style="font-size:11px; font-weight:bold; color:#00f0ff; letter-spacing:1px;" id="gameLogo">QUANTUM OVERLOAD</div>
    <div class="top-controls">
      <button class="btn-nav" id="langBtn" onclick="toggleLanguage()">LANG: EN</button>
      <button class="btn-nav" id="soundBtn" onclick="toggleSound()">AUDIO: ON</button>
      <button class="btn-nav" id="walletBtn" onclick="connectWallet()">BASE</button>
    </div>
  </div>

  <!-- 经验条 -->
  <div class="xp-container">
    <div class="xp-labels">
      <span id="levelLabel">LVL 1 PILOT</span>
      <span id="xpLabel">EXP 0 / 60</span>
    </div>
    <div class="xp-bar-bg">
      <div class="xp-bar-fill" id="xpFill"></div>
    </div>
  </div>

  <!-- 仪表盘 -->
  <div class="stats-card">
    <div class="stat-badge">
      <span style="color:#94a3b8;" id="labelYield">YIELD:</span> <span id="scoreDisplay" style="color:#00f0ff;">0</span>
    </div>
    <div class="stat-badge">
      <span style="color:#94a3b8;" id="labelHull">HULL:</span> <span id="healthDisplay" style="color:#00ff66;">100%</span>
    </div>
  </div>

  <!-- 底部动作按键 -->
  <div class="mobile-controls">
    <div class="action-circle-btn" id="skillBtn" onclick="triggerSkill()">
      <span style="font-size:14px;">⚡</span>
      <span id="skillBtnText">PHASE</span>
    </div>
    <div class="action-circle-btn" id="empBtn" onclick="triggerEmp()">
      <span style="font-size:14px;">💥</span>
      <span id="empBtnText">EMP 0%</span>
    </div>
  </div>

  <!-- 启动 & 结算弹窗 -->
  <div class="overlay" id="startOverlay">
    <h2 id="modalTitle" style="font-size: 20px; letter-spacing: 2px; margin-bottom: 4px;">QUANTUM OVERLOAD</h2>
    <p id="modalSubtitle" style="font-size: 10px; color: #94a3b8; letter-spacing: 1px;">BASE ECOSYSTEM BULLET HELL</p>
    
    <div id="instructionsBox" style="font-size: 11px; color:#cbd5e1; text-align:left; margin: 12px 0; line-height: 1.6; background: rgba(255,255,255,0.03); padding:10px; border-radius:8px; width:100%;">
      <!-- 动态注入语言 -->
    </div>

    <div id="web3Info" style="display:none; width:100%; margin-bottom:8px; font-size:11px; background:rgba(0,240,255,0.05); padding:8px; border-radius:6px; border:1px dashed rgba(0,240,255,0.3);">
      <div style="display:flex; justify-content:space-between;">
        <span id="w3ScoreLabel">FINAL SCORE:</span>
        <span id="finalScoreVal" style="color:#00f0ff; font-weight:bold;">0</span>
      </div>
      <div style="display:flex; justify-content:space-between; margin-top:3px;">
        <span id="w3PilotLabel">PILOT:</span>
        <span id="pilotAddress" style="color:#00ff66;">0x...</span>
      </div>
    </div>

    <button class="btn-action" id="startBtn" onclick="startGame()">INITIATE PROTOCOL</button>
    <button class="btn-action btn-twitter" id="twitterShareBtn" style="display:none;" onclick="shareToTwitter()">SHARE ON X (CLIPBOARD READY)</button>
    <button class="btn-action btn-secondary" id="claimBadgeBtn" style="display:none;" onclick="signAndExportBadge()">EXPORT 4K BADGE</button>
  </div>

  <!-- 局内自选升级弹窗 -->
  <div class="overlay" id="levelUpOverlay" style="display:none;">
    <h3 id="upgradeModalTitle" style="color:#00ff66; font-size:18px; letter-spacing:2px;">⚡ QUANTUM EVOLUTION ⚡</h3>
    <p id="upgradeModalSub" style="font-size:11px; color:#94a3b8; margin-top:2px;">SELECT 1 AUGMENTATION</p>
    <div class="upgrade-list" id="upgradeCardsContainer"></div>
  </div>

  <script>
    /* ==========================================================
       1. 语言系统 (i18n)
       ========================================================== */
    let currentLang = 'en';
    const i18n = {
      en: {
        langBtn: "LANG: EN",
        title: "QUANTUM OVERLOAD",
        subtitle: "BASE ECOSYSTEM BULLET HELL",
        instructions: [
          "• Drag to steer Core (<span style='color:#00ff66;'>Offset touch anti-blocking</span>)",
          "• <b>Graze</b> hazards for massive points & rapid EMP charge",
          "• Evade <span style='color:#ff0055;'>Red Plasma Bullets</span> & <b>Swarm Invasions</b>",
          "• Level up to deploy <span style='color:#00f0ff;'>Drones / Tesla / Shields</span>"
        ],
        level: "LVL", exp: "EXP", yield: "YIELD:", hull: "HULL:",
        startBtn: "INITIATE PROTOCOL", restartBtn: "RE-ENGAGE CORE",
        meltdownTitle: "REACTOR COLLAPSED", meltdownSub: "Core melted down under extreme particle swarm",
        empReady: "EMP READY", empCharging: "EMP", phase: "PHASE",
        finalScore: "FINAL SCORE:", pilot: "PILOT:",
        shareTwitter: "SHARE ON X (COPIES TEXT)", exportBadge: "EXPORT 4K BADGE",
        swarmAlert: "⚠️ WARNING: SWARM INVASION INCOMING ⚠️",
        bossAlert: "⚠️ TITAN COLOSSUS DETECTED ⚠️",
        toastCopied: "✅ SCORE COPIED! PASTE ON X / TWITTER",
        upgradeTitle: "⚡ QUANTUM EVOLUTION ⚡", upgradeSub: "SELECT 1 AUGMENTATION",
        upgrades: {
          drone: { title: "Orbital Drone", desc: "Spawns an orbiting satellite firing laser pulses at foes", icon: "🛰️" },
          tesla: { title: "Tesla Arc", desc: "Zaps nearest enemy with chain lightning every 2s", icon: "⚡" },
          shield: { title: "Plasma Shield", desc: "Deploys an energy barrier blocking 1 fatal strike", icon: "🛡️" },
          magnet: { title: "Hyper Magnet", desc: "Greatly expands attraction field for energy orbs", icon: "🧲" },
          fission: { title: "Particle Fission", desc: "Destroyed enemies have 35% chance to drop extra orbs", icon: "💥" }
        }
      },
      zh: {
        langBtn: "语言: 中文",
        title: "量子超载 // 极限弹幕",
        subtitle: "BASE 链原生高难度弹幕幸存者",
        instructions: [
          "• 单指滑动操控核心（<span style='color:#00ff66;'>指尖防遮挡优化</span>）",
          "• <b>擦弹走位</b> 贴近危险可获超额加分并急速积攒 EMP",
          "• 极限躲避 <span style='color:#ff0055;'>等离子散弹</span> 与 <b>全屏死士蜂群</b>",
          "• 升级解锁 <span style='color:#00f0ff;'>伴生僚机 / 特斯拉电弧 / 护盾</span>"
        ],
        level: "创世等级", exp: "量子能", yield: "能量收获:", hull: "核心耐久:",
        startBtn: "启动量子协议", restartBtn: "重启量子核心",
        meltdownTitle: "反应堆已失稳解体", meltdownSub: "在反物质风暴与弹幕围剿中湮灭",
        empReady: "EMP 就绪", empCharging: "EMP", phase: "相位虚化",
        finalScore: "最终收获能:", pilot: "驾驶员:",
        shareTwitter: "在 X 发推 (已复制文案)", exportBadge: "导出 4K 成绩勋章",
        swarmAlert: "⚠️ 极度危险：高频死士虫群突袭 ⚠️",
        bossAlert: "⚠️ 警告：虚空泰坦巨型首领降临 ⚠️",
        toastCopied: "✅ 战绩推文已复制到剪贴板！可直接粘贴发推",
        upgradeTitle: "⚡ 量子基因跃迁 ⚡", upgradeSub: "请选择一项核心武装升级：",
        upgrades: {
          drone: { title: "轨道量子僚机", desc: "生成伴生环绕卫星，自动发射激光扫射敌人", icon: "🛰️" },
          tesla: { title: "特斯拉电弧", desc: "每 2 秒自动释放链式闪电轰击最近的反物质", icon: "⚡" },
          shield: { title: "离子能量护盾", desc: "生成能量护盾，抵挡 1 次致命碰撞", icon: "🛡️" },
          magnet: { title: "超维引力磁吸", desc: "极大扩展能量吸附力场，自动拉扯全屏球体", icon: "🧲" },
          fission: { title: "反物质裂变", desc: "击碎敌人时 35% 几率裂变成小型能量球", icon: "💥" }
        }
      }
    };

    function showToast(msg) {
      const t = document.getElementById('toastMsg');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    function updateLanguageUI() {
      const t = i18n[currentLang];
      document.getElementById('langBtn').innerText = t.langBtn;
      document.getElementById('modalTitle').innerText = isGameOver ? t.meltdownTitle : t.title;
      document.getElementById('modalSubtitle').innerText = isGameOver ? t.meltdownSub : t.subtitle;
      document.getElementById('labelYield').innerText = t.yield;
      document.getElementById('labelHull').innerText = t.hull;
      document.getElementById('startBtn').innerText = isGameOver ? t.restartBtn : t.startBtn;
      document.getElementById('w3ScoreLabel').innerText = t.finalScore;
      document.getElementById('w3PilotLabel').innerText = t.pilot;
      document.getElementById('twitterShareBtn').innerText = t.shareTwitter;
      document.getElementById('claimBadgeBtn').innerText = t.exportBadge;
      document.getElementById('skillBtnText').innerText = t.phase;
      document.getElementById('upgradeModalTitle').innerText = t.upgradeTitle;
      document.getElementById('upgradeModalSub').innerText = t.upgradeSub;

      document.getElementById('levelLabel').innerText = `${t.level} ${level}`;
      document.getElementById('xpLabel').innerText = `${t.exp} ${xp} / ${xpToNext}`;

      const listHtml = t.instructions.map(item => `<div>${item}</div>`).join('');
      document.getElementById('instructionsBox').innerHTML = listHtml;
    }

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'zh' : 'en';
      updateLanguageUI();
    }

    /* ==========================================================
       2. Web Audio 音效合成器
       ========================================================== */
    let audioCtx = null, soundEnabled = true;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').innerText = soundEnabled ? "AUDIO: ON" : "AUDIO: OFF";
    }
    function playTone(freq, type, dur, slide = null) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (slide) osc.frequency.exponentialRampToValueAtTime(slide, audioCtx.currentTime + dur);
        g.gain.setValueAtTime(0.15, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }
    function vibrate(ms) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    /* ==========================================================
       3. 修复小狐狸钱包推特分享 & Base 勋章生成
       ========================================================== */
    let userAddress = null;
    async function connectWallet() {
      if (!window.ethereum) {
        alert(currentLang === 'zh' ? '请在 MetaMask / Coinbase 钱包 App 内置浏览器中打开！' : 'Please open inside MetaMask / Coinbase mobile browser!');
        return;
      }
      try {
        const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
        userAddress = accs[0];
        document.getElementById('walletBtn').innerText = `${userAddress.slice(0, 4)}...${userAddress.slice(-2)}`;
      } catch (e) {}
    }

    function shareToTwitter() {
      const shareUrl = window.location.href.split('?')[0];
      const rawText = `I survived to Level ${level} with ${score} Q-eV in Quantum Overload on @base! 🔵⚡\n\nCan you beat the bullet hell? Play live:\n${shareUrl}\n\n#Base #BuildOnBase #Web3Gaming`;

      // 1. 自动写入剪贴板（防小狐狸内置浏览器拦截）
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(rawText).catch(() => {});
      }

      showToast(i18n[currentLang].toastCopied);

      // 2. 尝试拉起 Twitter Intent (双向支持 _blank 和同窗口跳转)
      const intentUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(rawText)}`;
      try {
        const opened = window.open(intentUrl, '_blank');
        if (!opened || opened.closed || typeof opened.closed === 'undefined') {
          window.location.href = intentUrl; // MetaMask 内置浏览器备用跳转
        }
      } catch (e) {
        window.location.href = intentUrl;
      }
    }

    async function signAndExportBadge() {
      if (!userAddress && window.ethereum) await connectWallet();
      const timeStr = new Date().toISOString();
      const cvs = document.createElement('canvas');
      cvs.width = 1200; cvs.height = 630;
      const c = cvs.getContext('2d');
      c.fillStyle = '#030712'; c.fillRect(0,0,1200,630);
      c.strokeStyle = '#00f0ff'; c.lineWidth = 4; c.strokeRect(30,30,1140,570);
      c.fillStyle = '#00f0ff'; c.font = 'bold 36px monospace';
      c.fillText('QUANTUM OVERLOAD // BASE PROOF OF SCORE', 60, 90);
      c.fillStyle = '#00ff66'; c.font = 'bold 52px monospace';
      c.fillText(`FINAL SCORE: ${score} Q-eV (LVL ${level})`, 60, 240);
      c.fillStyle = '#94a3b8'; c.font = '24px monospace';
      c.fillText(`PILOT: ${userAddress || '0xANONYMOUS_PILOT'}`, 60, 340);
      c.fillText(`NETWORK: BASE MAINNET  |  TIME: ${timeStr}`, 60, 480);

      const a = document.createElement('a');
      a.download = `Quantum_Score_${score}.png`;
      a.href = cvs.toDataURL('image/png');
      a.click();
    }

    /* ==========================================================
       4. 硬核弹幕引擎 (Bullet Hell + Swarms + Boss Patterns)
       ========================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let isRunning = false, isPaused = false, isGameOver = false;
    let score = 0, health = 100, level = 1, xp = 0, xpToNext = 60;
    let empCharge = 0, invulnerableTimer = 0;
    let teslaTimer = 0, droneLaserTimer = 0, frenzyTimer = 0;
    let boss = null;
    let shakeIntensity = 0;

    const upgrades = { drone: 0, tesla: 0, shield: 0, magnet: 0, fission: 0 };
    let hasShieldActive = false;

    const player = {
      x: width / 2, y: height / 2,
      targetX: width / 2, targetY: height / 2,
      radius: 14, angle: 0, droneAngle: 0
    };

    let enemies = [], enemyBullets = [], gems = [], frenzyPrisms = [], particles = [], floatTexts = [];

    // 手指防遮挡控制 (向上偏移 45px)
    function handlePointer(x, y) {
      player.targetX = x;
      player.targetY = y - 45;
    }
    window.addEventListener('mousemove', e => handlePointer(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => {
      if (e.touches.length > 0) handlePointer(e.touches[0].clientX, e.touches[0].clientY);
    });
    window.addEventListener('touchstart', e => {
      if (e.touches.length > 0) handlePointer(e.touches[0].clientX, e.touches[0].clientY);
    });

    function triggerSkill() {
      if (!isRunning || isPaused || invulnerableTimer > 0) return;
      initAudio();
      invulnerableTimer = 80;
      playTone(450, 'sine', 0.3, 200);
      vibrate(40);
      createExplosion(player.x, player.y, '#c084fc', 16);
    }

    function triggerEmp() {
      if (!isRunning || isPaused || empCharge < 100) return;
      initAudio();
      empCharge = 0;
      updateEmpBtn();
      playTone(180, 'square', 0.5, 900);
      vibrate([50, 50, 100]);
      shakeIntensity = 15;

      // EMP 清除全屏敌人与弹幕
      enemyBullets = [];
      enemies.forEach(e => {
        score += 15;
        createExplosion(e.x, e.y, '#00f0ff', 6);
      });
      enemies = [];
      if (boss) {
        boss.health -= 250;
        createExplosion(boss.x, boss.y, '#ff0055', 20);
      }
      addFloatText(player.x, player.y - 20, "EMP NOVA!!", "#00f0ff");
    }

    function updateEmpBtn() {
      const btn = document.getElementById('empBtn');
      const txt = document.getElementById('empBtnText');
      const t = i18n[currentLang];
      if (empCharge >= 100) {
        btn.classList.add('emp-ready');
        txt.innerText = t.empReady;
      } else {
        btn.classList.remove('emp-ready');
        txt.innerText = `${t.empCharging} ${Math.floor(empCharge)}%`;
      }
    }

    function showBanner(text) {
      const banner = document.getElementById('dangerBanner');
      banner.innerText = text;
      banner.style.display = 'block';
      setTimeout(() => banner.style.display = 'none', 2400);
    }

    function addFloatText(x, y, text, color) {
      floatTexts.push({ x, y, text, color, life: 1.0 });
    }

    function createExplosion(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          life: 1.0,
          color
        });
      }
    }

    function checkLevelUp() {
      if (xp >= xpToNext) {
        xp -= xpToNext;
        level++;
        xpToNext = Math.floor(xpToNext * 1.45);
        isPaused = true;
        playTone(523, 'sine', 0.3, 1046);
        vibrate([80, 40, 80]);
        showLevelUpModal();
      }
      const t = i18n[currentLang];
      document.getElementById('levelLabel').innerText = `${t.level} ${level}`;
      document.getElementById('xpLabel').innerText = `${t.exp} ${xp} / ${xpToNext}`;
      document.getElementById('xpFill').style.width = `${(xp / xpToNext) * 100}%`;
    }

    function showLevelUpModal() {
      const container = document.getElementById('upgradeCardsContainer');
      container.innerHTML = '';
      const pool = ['drone', 'tesla', 'shield', 'magnet', 'fission'];
      const choices = pool.sort(() => 0.5 - Math.random()).slice(0, 3);

      choices.forEach(key => {
        const info = i18n[currentLang].upgrades[key];
        const card = document.createElement('div');
        card.className = 'upgrade-card';
        card.innerHTML = `
          <div class="upgrade-icon">${info.icon}</div>
          <div>
            <div style="font-weight:bold; font-size:13px; color:#00f0ff;">${info.title} <span style="font-size:10px; color:#00ff66;">Lv.${upgrades[key] + 1}</span></div>
            <div style="font-size:10px; color:#94a3b8; margin-top:2px;">${info.desc}</div>
          </div>
        `;
        card.onclick = () => selectUpgrade(key);
        container.appendChild(card);
      });

      document.getElementById('levelUpOverlay').style.display = 'flex';
    }

    function selectUpgrade(key) {
      upgrades[key]++;
      if (key === 'shield') hasShieldActive = true;
      document.getElementById('levelUpOverlay').style.display = 'none';
      isPaused = false;
      loop();
    }

    function startGame() {
      initAudio();
      score = 0; health = 100; level = 1; xp = 0; xpToNext = 50; empCharge = 0;
      invulnerableTimer = 0; teslaTimer = 0; droneLaserTimer = 0; frenzyTimer = 0;
      boss = null; hasShieldActive = false; shakeIntensity = 0;
      Object.keys(upgrades).forEach(k => upgrades[k] = 0);

      enemies = []; enemyBullets = []; gems = []; frenzyPrisms = []; particles = []; floatTexts = [];
      isGameOver = false; isPaused = false; isRunning = true;

      document.getElementById('startOverlay').style.display = 'none';
      document.getElementById('web3Info').style.display = 'none';
      document.getElementById('twitterShareBtn').style.display = 'none';
      document.getElementById('claimBadgeBtn').style.display = 'none';
      document.getElementById('scoreDisplay').innerText = score;
      document.getElementById('healthDisplay').innerText = '100%';
      document.getElementById('healthDisplay').style.color = '#00ff66';
      updateEmpBtn();
      checkLevelUp();
      loop();
    }

    function gameOver() {
      isRunning = false; isGameOver = true;
      playTone(100, 'sawtooth', 0.4, 30);
      vibrate([150, 100, 200]);
      updateLanguageUI();
      document.getElementById('finalScoreVal').innerText = `${score} Q-eV (LVL ${level})`;
      document.getElementById('pilotAddress').innerText = userAddress ? `${userAddress.slice(0,6)}...${userAddress.slice(-4)}` : 'GUEST PILOT';
      document.getElementById('web3Info').style.display = 'block';
      document.getElementById('twitterShareBtn').style.display = 'flex';
      document.getElementById('claimBadgeBtn').style.display = 'flex';
      document.getElementById('startOverlay').style.display = 'flex';
    }

    function takeDamage(dmg) {
      if (invulnerableTimer > 0) return;
      if (hasShieldActive) {
        hasShieldActive = false;
        invulnerableTimer = 50;
        playTone(300, 'square', 0.2);
        addFloatText(player.x, player.y - 20, "SHIELD BROKEN!", "#00f0ff");
        return;
      }
      health -= dmg;
      shakeIntensity = 12;
      playTone(120, 'sawtooth', 0.2);
      vibrate(60);
      document.getElementById('healthDisplay').innerText = `${Math.max(0, health)}%`;
      if (health <= 30) document.getElementById('healthDisplay').style.color = '#ff0055';
      if (health <= 0) gameOver();
    }

    /* 游戏主循环 */
    let frame = 0;
    function loop() {
      if (!isRunning || isPaused) return;
      frame++;

      player.x += (player.targetX - player.x) * 0.24;
      player.y += (player.targetY - player.y) * 0.24;

      // 屏幕震动
      let sx = 0, sy = 0;
      if (shakeIntensity > 0) {
        sx = (Math.random() - 0.5) * shakeIntensity;
        sy = (Math.random() - 0.5) * shakeIntensity;
        shakeIntensity *= 0.88;
        if (shakeIntensity < 0.5) shakeIntensity = 0;
      }

      ctx.save();
      ctx.translate(sx, sy);

      if (frenzyTimer > 0) {
        frenzyTimer--;
        ctx.fillStyle = 'rgba(255, 170, 0, 0.18)';
        ctx.fillRect(0, 0, width, height);
      } else {
        ctx.fillStyle = 'rgba(3, 7, 18, 0.32)';
        ctx.fillRect(0, 0, width, height);
      }

      // 1. 僚机
      if (upgrades.drone > 0) {
        player.droneAngle += 0.05;
        const droneCount = upgrades.drone;
        droneLaserTimer++;
        for (let d = 0; d < droneCount; d++) {
          const dAngle = player.droneAngle + (d * (Math.PI * 2 / droneCount));
          const dx = player.x + Math.cos(dAngle) * 42;
          const dy = player.y + Math.sin(dAngle) * 42;

          ctx.fillStyle = '#00f0ff';
          ctx.beginPath(); ctx.arc(dx, dy, 5, 0, Math.PI * 2); ctx.fill();

          if (droneLaserTimer % 35 === 0 && enemies.length > 0) {
            const target = enemies[d % enemies.length];
            playTone(1200, 'sine', 0.05);
            ctx.strokeStyle = '#00ff66';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(dx, dy); ctx.lineTo(target.x, target.y); ctx.stroke();
            createExplosion(target.x, target.y, '#00ff66', 4);
            score += 5;
            enemies.splice(d % enemies.length, 1);
          }
        }
      }

      // 2. 特斯拉电弧
      if (upgrades.tesla > 0) {
        teslaTimer++;
        if (teslaTimer > Math.max(35, 90 - upgrades.tesla * 15) && enemies.length > 0) {
          teslaTimer = 0;
          const target = enemies[0];
          playTone(880, 'sine', 0.08);
          ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(player.x, player.y);
          ctx.lineTo((player.x + target.x)/2 + (Math.random()-0.5)*30, (player.y + target.y)/2);
          ctx.lineTo(target.x, target.y); ctx.stroke();
          createExplosion(target.x, target.y, '#00f0ff', 6);
          score += 10;
          enemies.shift();
        }
      }

      // 3. 生成道具与狂暴棱镜
      if (frame % 28 === 0) gems.push({ x: Math.random() * (width - 40) + 20, y: Math.random() * (height - 120) + 60, r: 6, pulse: 0 });
      if (frame % 650 === 0) frenzyPrisms.push({ x: Math.random() * (width - 40) + 20, y: Math.random() * (height - 120) + 60, r: 12, pulse: 0 });

      // 4. 生成普通敌人与远程射手
      const spawnRate = Math.max(10, 32 - level * 3);
      if (frame % spawnRate === 0) {
        const angle = Math.random() * Math.PI * 2;
        const d = Math.max(width, height) / 2 + 30;
        const ex = width / 2 + Math.cos(angle) * d;
        const ey = height / 2 + Math.sin(angle) * d;
        const isShooter = Math.random() < 0.25;

        enemies.push({
          x: ex, y: ey,
          vx: ((player.x - ex) / d) * (2.8 + level * 0.2),
          vy: ((player.y - ey) / d) * (2.8 + level * 0.2),
          r: isShooter ? 9 : 7,
          isShooter: isShooter,
          shootTimer: 0,
          grazed: false
        });
      }

      // 5. 虫群入侵事件 (Swarm Invasions 每 450 帧)
      if (frame % 450 === 0 && score > 80) {
        showBanner(i18n[currentLang].swarmAlert);
        vibrate([80, 50, 80]);
        for (let s = 0; s < 12; s++) {
          const sAngle = (s / 12) * Math.PI * 2;
          const sDist = Math.max(width, height) / 2 + 40;
          enemies.push({
            x: width / 2 + Math.cos(sAngle) * sDist,
            y: height / 2 + Math.sin(sAngle) * sDist,
            vx: Math.cos(sAngle + Math.PI) * (4.2 + level * 0.2),
            vy: Math.sin(sAngle + Math.PI) * (4.2 + level * 0.2),
            r: 5, isShooter: false, grazed: false
          });
        }
      }

      // 6. 泰坦首领生成与弹幕
      if (score >= 250 && !boss && frame % 600 === 0) {
        boss = { x: width / 2, y: 110, r: 32, health: 500, maxHealth: 500, angle: 0, bulletAngle: 0 };
        showBanner(i18n[currentLang].bossAlert);
        vibrate([100, 50, 100]);
      }

      // 7. 处理能量球
      const magnetRange = frenzyTimer > 0 ? 600 : (60 + upgrades.magnet * 50);
      for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        g.pulse += 0.08;
        const dx = player.x - g.x, dy = player.y - g.y;
        const dist = Math.hypot(dx, dy);

        if (dist < magnetRange) {
          g.x += (dx / dist) * 8;
          g.y += (dy / dist) * 8;
        }

        ctx.fillStyle = '#00ff66';
        ctx.beginPath(); ctx.arc(g.x, g.y, g.r + Math.sin(g.pulse)*2, 0, Math.PI*2); ctx.fill();

        if (dist < player.radius + g.r) {
          playTone(650, 'sine', 0.08);
          vibrate(15);
          score += 10; xp += 15;
          empCharge = Math.min(100, empCharge + 8);
          updateEmpBtn();
          checkLevelUp();
          document.getElementById('scoreDisplay').innerText = score;
          gems.splice(i, 1);
        }
      }

      // 8. 处理狂暴棱镜
      for (let i = frenzyPrisms.length - 1; i >= 0; i--) {
        const fp = frenzyPrisms[i];
        fp.pulse += 0.08;
        ctx.fillStyle = '#ffaa00';
        ctx.beginPath(); ctx.arc(fp.x, fp.y, fp.r + Math.sin(fp.pulse)*3, 0, Math.PI*2); ctx.fill();

        if (Math.hypot(player.x - fp.x, player.y - fp.y) < player.radius + fp.r) {
          frenzyTimer = 180;
          playTone(900, 'square', 0.4, 1800);
          vibrate([60, 60, 120]);
          addFloatText(player.x, player.y - 30, "WARP FRENZY!!", "#ffaa00");
          frenzyPrisms.splice(i, 1);
        }
      }

      // 9. 处理敌人与远程射击
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x += e.vx; e.y += e.vy;

        // 远程敌人发射弹幕
        if (e.isShooter) {
          e.shootTimer++;
          if (e.shootTimer > 75) {
            e.shootTimer = 0;
            const bAngle = Math.atan2(player.y - e.y, player.x - e.x);
            enemyBullets.push({
              x: e.x, y: e.y,
              vx: Math.cos(bAngle) * 4.5,
              vy: Math.sin(bAngle) * 4.5,
              r: 4
            });
            playTone(320, 'square', 0.06);
          }
        }

        ctx.fillStyle = e.isShooter ? '#ffaa00' : '#ff0055';
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();

        const dist = Math.hypot(player.x - e.x, player.y - e.y);

        // 擦弹
        if (!e.grazed && dist < player.radius + e.r + 14 && dist >= player.radius + e.r) {
          e.grazed = true;
          score += 25;
          empCharge = Math.min(100, empCharge + 15);
          updateEmpBtn();
          playTone(1400, 'triangle', 0.06);
          vibrate(20);
          addFloatText(e.x, e.y, "GRAZE +25", "#00f0ff");
          createExplosion(e.x, e.y, '#00f0ff', 4);
        }

        // 狂暴碾压
        if (frenzyTimer > 0 && dist < player.radius + e.r) {
          score += 20;
          createExplosion(e.x, e.y, '#ffaa00', 8);
          enemies.splice(i, 1);
          continue;
        }

        // 碰撞受创
        if (dist < player.radius + e.r) {
          takeDamage(35);
          enemies.splice(i, 1);
        }
      }

      // 10. 处理敌方弹幕 (Bullet Hell)
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        b.x += b.vx; b.y += b.vy;

        ctx.fillStyle = '#ff0055';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 8; ctx.fill(); ctx.shadowBlur = 0;

        if (Math.hypot(player.x - b.x, player.y - b.y) < player.radius + b.r) {
          takeDamage(25);
          enemyBullets.splice(i, 1);
          continue;
        }

        // 出界销毁
        if (b.x < 0 || b.x > width || b.y < 0 || b.y > height) {
          enemyBullets.splice(i, 1);
        }
      }

      // 11. 处理 Boss 与 360° 旋转弹幕
      if (boss) {
        boss.angle += 0.03;
        boss.bulletAngle += 0.12;
        boss.x += Math.sin(boss.angle) * 3;

        // Boss 周期发射螺旋弹幕
        if (frame % 16 === 0) {
          for (let k = 0; k < 4; k++) {
            const rot = boss.bulletAngle + (k * (Math.PI / 2));
            enemyBullets.push({
              x: boss.x, y: boss.y,
              vx: Math.cos(rot) * 3.5,
              vy: Math.sin(rot) * 3.5,
              r: 4.5
            });
          }
        }

        ctx.fillStyle = '#7928ca'; ctx.beginPath(); ctx.arc(boss.x, boss.y, boss.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 3; ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(boss.x - 36, boss.y - 45, 72, 6);
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(boss.x - 36, boss.y - 45, (boss.health / boss.maxHealth) * 72, 6);

        if (boss.health <= 0) {
          createExplosion(boss.x, boss.y, '#00ff66', 35);
          score += 300; xp += 150;
          boss = null;
          checkLevelUp();
        }
      }

      // 12. 绘制玩家
      if (invulnerableTimer > 0) {
        invulnerableTimer--;
        ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 8, 0, Math.PI * 2); ctx.stroke();
      }
      if (hasShieldActive) {
        ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 12, 0, Math.PI * 2); ctx.stroke();
      }

      player.angle += 0.05;
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);
      ctx.strokeStyle = frenzyTimer > 0 ? '#ffaa00' : '#00f0ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(-player.radius, -player.radius, player.radius * 2, player.radius * 2);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      // 13. 粒子与浮动文字
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 0.04;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
        ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
      for (let i = floatTexts.length - 1; i >= 0; i--) {
        const ft = floatTexts[i];
        ft.y -= 1; ft.life -= 0.03;
        if (ft.life <= 0) { floatTexts.splice(i, 1); continue; }
        ctx.fillStyle = ft.color; ctx.font = 'bold 12px monospace'; ctx.globalAlpha = ft.life;
        ctx.fillText(ft.text, ft.x - 20, ft.y);
        ctx.globalAlpha = 1;
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }

    updateLanguageUI();
  </script>
</body>
</html>
